name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_USER: sec_research
          POSTGRES_PASSWORD: sec_research_dev
          POSTGRES_DB: sec_research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sec_research -d sec_research_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sec_research:sec_research_dev@127.0.0.1:5432/sec_research_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install pinned uv and locked dependencies
        run: |
          python -m pip install uv==0.12.23
          bash scripts/uv.sh sync --frozen
      - name: Lint, format, type and all tests
        run: bash scripts/check.sh
      - name: Build and verify installed wheel
        run: bash scripts/verify-wheel.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate and build Compose services
        run: |
          bash scripts/docker.sh compose config --quiet
          bash scripts/build.sh
      - name: Start database, explicitly migrate, verify API
        run: |
          bash scripts/docker.sh compose up -d --wait db
          bash scripts/docker.sh compose --profile app run --rm migrate
          bash scripts/docker.sh compose --profile app up -d --no-build --wait api
          curl --fail --silent http://127.0.0.1:8000/health/live | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"alive"}'
          curl --fail --silent http://127.0.0.1:8000/health/ready | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ready"}'
      - name: Container diagnostics
        if: failure()
        run: bash scripts/docker.sh compose --profile app logs --no-color
      - name: Stop isolated CI services
        if: always()
        run: bash scripts/docker.sh compose --profile app down --volumes
